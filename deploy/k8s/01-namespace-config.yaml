apiVersion: v1
kind: Namespace
metadata:
  name: scalelink
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scalelink-config
  namespace: scalelink
data:
  POSTGRES_HOST: "postgres.scalelink.svc.cluster.local"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis.scalelink.svc.cluster.local"
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: "kafka.scalelink.svc.cluster.local:9092"
  KAFKA_TOPIC_CLICKS: "url.clicks.v1"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger.scalelink.svc.cluster.local:4318"
---
apiVersion: v1
kind: Secret
metadata:
  name: scalelink-secrets
  namespace: scalelink
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_secure_production_password"
