events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format including W3C traceparent context
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'traceparent="$http_traceparent" upstream_response_time=$upstream_response_time';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    gzip  on;
    gzip_types application/json text/plain text/css application/javascript;

    # Microservice Upstream Definitions (RFC 1123 compliant without underscores)
    upstream java-link-service {
        server url-service:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream python-analytics-service {
        server analytics-service:8000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Standard Proxy Headers & W3C Distributed Tracing
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header traceparent $http_traceparent;

        # Centralized CORS Configuration
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,traceparent' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Gateway Health Check
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","gateway":"Nginx API Gateway","timestamp":"$time_iso8601"}';
        }

        # Route 1: URL Creation & Management -> Java Link Service
        location /api/v1/urls {
            proxy_pass http://java-link-service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 5s;
        }

        # Route 2: Analytics & Reporting -> Python Analytics Engine
        location /api/v1/analytics {
            proxy_pass http://python-analytics-service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 10s;
        }

        # Route 3: Fast Redirect Path (e.g. GET /{shortCode}) -> Java Link Service
        location / {
            proxy_pass http://java-link-service;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_read_timeout 3s;
        }
    }
}
