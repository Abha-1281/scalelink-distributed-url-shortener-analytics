version: '3.8'

services:
  # ===========================================================================
  # Core Infrastructure & Middleware
  # ===========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: scalelink-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scalelink-net

  redis:
    image: redis:7-alpine
    container_name: scalelink-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - scalelink-net

  kafka:
    image: apache/kafka:3.7.0
    container_name: scalelink-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      # KRaft mode settings (zero Zookeeper dependency)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - scalelink-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: scalelink-kafka-ui
    restart: always
    ports:
      - "9000:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: scalelink-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - scalelink-net

  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: scalelink-jaeger
    restart: always
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTel gRPC receiver
      - "4318:4318"   # OTel HTTP receiver
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - scalelink-net

  # ===========================================================================
  # Microservices Layer
  # ===========================================================================

  url-service:
    build:
      context: ./services/url-service
      dockerfile: Dockerfile
    container_name: scalelink-url-service
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/link_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MANAGEMENT_OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - scalelink-net

  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: scalelink-analytics-service
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/analytics_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_TOPIC_CLICKS: url.clicks.v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - scalelink-net

  # ===========================================================================
  # Edge Gateway Layer
  # ===========================================================================

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: scalelink-gateway
    restart: always
    ports:
      - "8088:80"
    depends_on:
      - url-service
      - analytics-service
    networks:
      - scalelink-net

# =============================================================================
# Networks and Volumes
# =============================================================================

networks:
  scalelink-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
